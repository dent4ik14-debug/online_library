<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
  </head>
  <body>
    <section>
      <h1>Домашня сторінка</h1>
      <p>Домашня сторінка нашої онлайн бібліотеки</p>
      <a href="{% url 'book_catalog:catalog' %}">Перейти до каталогу</a>
    </section>
    <section>
      {% if user.is_authenticated %}
      <a href="{% url 'users:profile' %}">Профіль</a>
      <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-link" style="padding: 0; border: none; background: none;">
          Вийти
        </button>
      </form>
      {% else %}
      <a href="{% url 'users:login' %}">Увійти</a>
      <a href="{% url 'users:register' %}">Зареєструватись</a>
      {% endif %}
    </section>
  </body>

</html>
